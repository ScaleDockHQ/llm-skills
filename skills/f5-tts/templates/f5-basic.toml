# f5-tts_infer-cli config. Run: f5-tts_infer-cli -c f5-basic.toml
# Verified against F5-TTS 1.1.22 (src/f5_tts/infer/examples/basic/basic.toml), 2026-10-11.
# The pretrained weights are CC-BY-NC: non-commercial use only. Clone only voices you have permission to use.
model = "F5TTS_v1_Base" # F5TTS_v1_Base | E2TTS_Base
ref_audio = "ref.wav" # under 12 s, clean single speaker, ~1 s trailing silence
ref_text = "" # exact transcript; empty means auto-transcribe (extra GPU memory)
gen_text = "Hello, this is a test of voice cloning."
gen_file = "" # a text file; overrides gen_text when set
remove_silence = false
output_dir = "out"

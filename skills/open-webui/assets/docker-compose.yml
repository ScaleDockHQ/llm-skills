# Pin an exact tag from https://github.com/open-webui/open-webui/releases (check before use).
# Create .env (mode 0600) with: WEBUI_SECRET_KEY=<output of: openssl rand -hex 32>
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.0
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080" # put a TLS reverse proxy in front; drop 127.0.0.1 only on purpose
    volumes:
      - open-webui:/app/backend/data # chats, users, settings, uploads; survives updates
    extra_hosts:
      - host.docker.internal:host-gateway # lets the container reach engines on the Docker host (Linux)
    env_file: .env
    environment:
      - ENABLE_OLLAMA_API=False # set True if you use an Ollama connection
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=10
    restart: unless-stopped

volumes:
  open-webui:

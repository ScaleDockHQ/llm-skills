# systemd drop-in: sudo systemctl edit nvidia-dcgm-exporter.service   (paste, save, then restart)
# Replaces the vendor command to use a custom collector CSV and a private listen address.
# Verified against DCGM docs "Customizing the systemd Service", 2026-10-11.
[Service]
ExecStart=
ExecStart=/usr/bin/dcgm-exporter -f /etc/dcgm-exporter/llm-counters.csv -a 10.0.0.1:9400

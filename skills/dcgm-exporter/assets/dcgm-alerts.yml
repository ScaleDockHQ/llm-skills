# Alert rules for DCGM metrics. Validate: promtool check rules dcgm-alerts.yml
# Verified against dcgm-exporter 4.8.4 default-counters.csv, 2026-10-11. Thresholds are starting points.
groups:
  - name: gpu-causes
    rules:
      - alert: DCGMExporterDown
        expr: up{job="dcgm"} == 0
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "dcgm-exporter on {{ $labels.instance }} is not scrapable"
      - alert: DCGMNoGPUMetrics
        expr: absent(DCGM_FI_DEV_GPU_TEMP) and on() up{job="dcgm"} == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Exporter is up but exports no GPU metrics (driver or DCGM mismatch, GPUs not visible)"
      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "XID {{ $value }} on {{ $labels.instance }} GPU {{ $labels.gpu }}"
          description: "Look up the XID in NVIDIA's XID documentation; some require a reset."
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "GPU {{ $labels.gpu }} above 85C on {{ $labels.instance }}"
          description: "Set the threshold from your GPU's documented limit."
      - alert: GPUThermalThrottling
        expr: rate(DCGM_FI_DEV_THERMAL_VIOLATION[5m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "GPU {{ $labels.gpu }} thermally throttled on {{ $labels.instance }}"
      - alert: GPUPowerThrottling
        expr: rate(DCGM_FI_DEV_POWER_VIOLATION[5m]) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "GPU {{ $labels.gpu }} power-capped on {{ $labels.instance }}"

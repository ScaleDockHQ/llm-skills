; Router-mode presets for llama-server:  llama-server --models-preset ./models.ini --host 127.0.0.1 --port 9931
; Keys are flags without dashes (n-gpu-layers), short forms (c, ngl) or LLAMA_ARG_* names.
; Precedence: command line > model section > [*]. Paths are relative to the server's CWD: use absolute paths.
; The router controls host, port, API key, hf-repo and alias of children.
version = 1

[*]
c = 8192
n-gpu-layers = all
flash-attn = on

; An existing cached model id: these settings become its defaults.
[ggml-org/gemma-3-4b-it-GGUF:Q4_K_M]
c = 16384
jinja = true
load-on-startup = true

; A model not in the cache needs at least a model path or HF repo.
[local-qwen]
model = /srv/models/gguf/Qwen3-8B-Q4_K_M.gguf
c = 32768
cache-type-k = q8_0
cache-type-v = q8_0
stop-timeout = 20

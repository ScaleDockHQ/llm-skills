# OpenTelemetry Collector in front of Weave: injects project routing, strips message content.
# Verified against Weave docs "Send OpenTelemetry Traces to Weave" (collector example), validated with collector-contrib 0.162.0, 2026-10-11.
# Run with env WANDB_API_KEY (from a 0600 env file), WANDB_OTLP_ENDPOINT, DEFAULT_WANDB_ENTITY, DEFAULT_WANDB_PROJECT.
# Multi-tenant endpoint base: https://trace.wandb.ai/otel ; Dedicated/Self-Managed: https://<subdomain>.wandb.io/traces/otel
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  resource:
    attributes:
      - key: wandb.entity
        value: ${env:DEFAULT_WANDB_ENTITY}
        action: insert
      - key: wandb.project
        value: ${env:DEFAULT_WANDB_PROJECT}
        action: insert
  attributes/strip-content:
    actions:
      # GenAI message content attributes (OpenTelemetry GenAI conventions)
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      # OpenInference input/output values
      - { key: input.value, action: delete }
      - { key: output.value, action: delete }
  batch: {}

exporters:
  otlphttp/weave:
    endpoint: ${env:WANDB_OTLP_ENDPOINT}
    headers:
      wandb-api-key: ${env:WANDB_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, attributes/strip-content, batch]
      exporters: [otlphttp/weave]

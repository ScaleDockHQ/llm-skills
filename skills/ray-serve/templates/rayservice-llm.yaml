# RayService for an OpenAI-compatible LLM endpoint. Adapted from the KubeRay v1.7.1 sample
# ray-operator/config/samples/ray-service.llm-serve.yaml. Before applying (after approval):
#   - set the image tag to a ray-llm tag you verified, and rayVersion to the same Ray version
#   - create the Secret from a 0600 file:
#       kubectl create secret generic hf-token --from-file=hf_token=./hf-token.txt
#   - size nvidia.com/gpu to tensor_parallel_size * pipeline_parallel_size
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: ray-serve-llm
spec:
  serveConfigV2: |
    applications:
    - name: llms
      import_path: ray.serve.llm:build_openai_app
      route_prefix: "/"
      args:
        llm_configs:
        - model_loading_config:
            model_id: qwen2.5-7b-instruct
            model_source: Qwen/Qwen2.5-7B-Instruct
          engine_kwargs:
            max_model_len: 8192
            gpu_memory_utilization: 0.85
          deployment_config:
            autoscaling_config:
              min_replicas: 1
              max_replicas: 4
              target_ongoing_requests: 64
            max_ongoing_requests: 128
  rayClusterConfig:
    rayVersion: "2.59.0"
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        num-cpus: "0" # no replicas on the head
        num-gpus: "0"
      template:
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray-llm:2.59.0-py312-cu130 # verify the tag exists for your arch
              ports:
                - { containerPort: 8000, name: serve }
                - { containerPort: 8080, name: metrics }
                - { containerPort: 6379, name: gcs }
                - { containerPort: 8265, name: dashboard }
                - { containerPort: 10001, name: client }
              resources:
                limits: { cpu: "2", memory: 5Gi }
                requests: { cpu: "2", memory: 4Gi }
    workerGroupSpecs:
      - groupName: gpu-group
        replicas: 1
        minReplicas: 1
        maxReplicas: 4 # Ray autoscaler adds nodes up to this
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: rayproject/ray-llm:2.59.0-py312-cu130
                env:
                  - name: HUGGING_FACE_HUB_TOKEN
                    valueFrom:
                      secretKeyRef: { name: hf-token, key: hf_token }
                volumeMounts:
                  - { name: shm, mountPath: /dev/shm }
                resources:
                  limits: { cpu: "8", memory: 48Gi, nvidia.com/gpu: "1" }
                  requests: { cpu: "8", memory: 48Gi, nvidia.com/gpu: "1" }
            volumes:
              - name: shm
                emptyDir: { medium: Memory, sizeLimit: 8Gi }
            # tolerations / nodeSelector for your GPU nodes go here

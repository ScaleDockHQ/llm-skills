# Accelerate config for LoRA training with DeepSpeed ZeRO-3 on one 8-GPU node.
# Values mirror the example in the PEFT DeepSpeed guide (docs/source/accelerate/deepspeed.md,
# examples/sft/configs/deepspeed_config.yaml). Create your own with:
#   accelerate config --config_file deepspeed_config.yaml
# Launch:  accelerate launch --config_file deepspeed_config.yaml train.py <script args>
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_accumulation_steps: 4 # must equal the value passed to the training script
  offload_optimizer_device: none # cpu or nvme to save GPU memory
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: "no"
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8 # GPUs on this node
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

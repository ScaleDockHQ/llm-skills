# One trtllm-serve model. Untested template.
# Usage: HF_TOKEN is read from the environment or an env file with mode 0600; never commit it.
services:
  trtllm:
    image: nvcr.io/nvidia/tensorrt-llm/release:1.2.1
    container_name: trtllm-qwen3
    restart: unless-stopped
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: "0" # set to "1" after weights are cached
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./config.yml:/cfg/config.yml:ro
    command: >
      trtllm-serve nvidia/Qwen3-8B-FP8 --host 0.0.0.0 --port 8000
      --max_batch_size 32 --config /cfg/config.yml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

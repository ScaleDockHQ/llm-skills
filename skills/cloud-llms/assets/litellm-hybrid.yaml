# LiteLLM proxy config: local backend + cloud providers + fallbacks + budgets, all behind one endpoint.
# Keys and settings verified against LiteLLM v1.105.0 docs (proxy configs, config settings, reliability,
# provider budget routing, provider pages), 2026-10-11. General gateway features live in the llm-gateway skill.
#
# Usage:
#   litellm --config litellm-hybrid.yaml
#   Clients: base URL https://llm.example.com/v1 (or http://localhost:4000/v1), key = a LiteLLM virtual key.
#
# Rules applied here:
#   - Every secret is read from the environment (os.environ/...). Never paste keys into this file.
#   - Replace <placeholders> with pinned, dated/versioned model IDs from each provider's model list.
#   - Delete the providers you do not use. Fallback targets must be allowed for the data in the source alias.
#   - Key, team and global budgets are enforced from the database; without DATABASE_URL they are not enforced.

model_list:
  # ---------------------------------------------------------------------------
  # Local / self-hosted primary (vLLM or llama-swap on an owned server or GPU VM)
  # ---------------------------------------------------------------------------
  - model_name: chat # alias clients call
    litellm_params:
      model: hosted_vllm/<served-model-name>
      api_base: http://10.0.0.1:8000/v1 # node-a, private network only
      api_key: os.environ/LOCAL_VLLM_API_KEY
      timeout: 120
      stream_timeout: 30 # fail over quickly if the local box stops streaming

  # Data that must never leave your hardware: no cloud fallback is configured for this alias.
  - model_name: private
    litellm_params:
      model: hosted_vllm/<served-model-name>
      api_base: http://10.0.0.1:8000/v1
      api_key: os.environ/LOCAL_VLLM_API_KEY

  # ---------------------------------------------------------------------------
  # Overflow: the same open model on a managed open-model API (keeps behavior close)
  # ---------------------------------------------------------------------------
  - model_name: chat-overflow
    litellm_params:
      model: together_ai/<org>/<same-open-model>
      api_key: os.environ/TOGETHERAI_API_KEY
      max_budget: 50 # USD per budget_duration for this deployment
      budget_duration: 30d
  # Alternative overflow targets (pick one):
  # - model_name: chat-overflow
  #   litellm_params:
  #     model: groq/<model-id>
  #     api_key: os.environ/GROQ_API_KEY
  # - model_name: chat-overflow
  #   litellm_params:
  #     model: openai/<model-id>                      # any OpenAI-compatible endpoint
  #     api_base: https://api.runpod.ai/v2/<endpoint-id>/openai/v1
  #     api_key: os.environ/RUNPOD_API_KEY

  # ---------------------------------------------------------------------------
  # Frontier APIs
  # ---------------------------------------------------------------------------
  - model_name: frontier-code
    litellm_params:
      model: anthropic/<claude-model-id>
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: frontier-chat
    litellm_params:
      model: openai/<openai-model-id>
      api_key: os.environ/OPENAI_API_KEY
  - model_name: frontier-long-context
    litellm_params:
      model: gemini/<gemini-model-id>
      api_key: os.environ/GEMINI_API_KEY # use a billing-enabled (paid) project for non-public data

  # ---------------------------------------------------------------------------
  # Hyperscalers (same or similar models under your cloud account, IAM and region)
  # ---------------------------------------------------------------------------
  - model_name: frontier-code-bedrock
    litellm_params:
      model: bedrock/<inference-profile-or-model-id>
      aws_region_name: <region> # credentials from the AWS chain (instance role / AWS_PROFILE)
  - model_name: frontier-long-context-vertex
    litellm_params:
      model: vertex_ai/<gemini-model-id>
      vertex_project: <project>
      vertex_location: <location> # Application Default Credentials / workload identity
  - model_name: frontier-chat-azure
    litellm_params:
      model: azure/<deployment-name> # the Foundry deployment name, not the model name
      api_base: https://<resource>.openai.azure.com/
      api_version: "<api-version>"
      api_key: os.environ/AZURE_API_KEY

router_settings:
  # Fallbacks run after num_retries fail on the source model group.
  fallbacks:
    - chat: ["chat-overflow", "frontier-chat"]
    - frontier-code: ["frontier-code-bedrock"]
    - frontier-chat: ["frontier-chat-azure"]
    - frontier-long-context: ["frontier-long-context-vertex"]
    # "private" is intentionally absent: it never fails over to the cloud.
  context_window_fallbacks:
    - chat: ["frontier-long-context"]
  num_retries: 2
  timeout: 300
  # Spend caps per provider; requests to a provider stop routing once its budget is used.
  provider_budget_config:
    openai:
      budget_limit: 200 # USD
      time_period: 1mo
    anthropic:
      budget_limit: 200
      time_period: 1mo
    gemini:
      budget_limit: 100
      time_period: 1mo
    together_ai:
      budget_limit: 50
      time_period: 1mo
  # Needed when running more than one LiteLLM instance, so budgets and cooldowns are shared:
  # redis_host: os.environ/REDIS_HOST
  # redis_port: os.environ/REDIS_PORT
  # redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  allowed_fails: 3 # failures per minute before a deployment cools down
  cooldown_time: 30 # seconds
  request_timeout: 600
  max_budget: 500 # USD, whole proxy; enforced only with a database
  budget_duration: 30d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL # required for virtual keys and key/team/global budgets

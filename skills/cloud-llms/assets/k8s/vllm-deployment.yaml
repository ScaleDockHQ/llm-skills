# vLLM on Kubernetes: PVC (model cache) + Deployment + Service.
# Based on vLLM's official "Using Kubernetes" guide (docs/deployment/k8s.md, vLLM v0.31.0):
#   https://docs.vllm.ai/en/latest/deployment/k8s/
#
# Before applying:
#   1. GPU nodes with the NVIDIA device plugin (e.g. NVIDIA GPU Operator).
#   2. For gated/private models, create the token Secret from a file (never inline the token):
#        kubectl create secret generic hf-token-secret --from-file=token=<path-to-token-file>
#   3. Replace every <placeholder>. Pin the image tag to a tested vLLM release.
#
# Apply and test:
#   kubectl apply -f vllm-deployment.yaml
#   kubectl rollout status deploy/vllm-chat
#   kubectl port-forward svc/vllm-chat 8000:80
#   curl -s http://localhost:8000/v1/models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-chat-cache
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce # one replica per PVC; use ReadWriteMany storage to share across replicas
  resources:
    requests:
      storage: 100Gi # weights + room for one model update
  # storageClassName: <storage-class>
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-chat
  namespace: default
  labels:
    app: vllm-chat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0 # no spare GPU for a surge pod; capacity dips during rollout
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-chat
  template:
    metadata:
      labels:
        app: vllm-chat
    spec:
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: vllm-chat-cache
        # vLLM needs host shared memory for tensor-parallel inference.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
      containers:
        - name: vllm
          image: vllm/vllm-openai:<pinned-version>
          command: ["/bin/sh", "-c"]
          args:
            - >-
              vllm serve <hf-org>/<model>
              --revision <commit-or-tag>
              --served-model-name <alias>
              --max-model-len <tokens>
              --gpu-memory-utilization 0.90
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
                  optional: true # remove "optional" if the model is gated
            # Uncomment to require a bearer key on /v1 routes (does not cover every route; keep the Service internal).
            # - name: VLLM_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: vllm-api-key
            #       key: key
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "10"
              memory: 40G
              nvidia.com/gpu: "1" # match --tensor-parallel-size if you add it
            requests:
              cpu: "2"
              memory: 16G
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /root/.cache/huggingface
              name: cache-volume
            - name: shm
              mountPath: /dev/shm
          # Model download + load can take many minutes; the startup probe holds off the other probes.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-chat
  namespace: default
spec:
  selector:
    app: vllm-chat
  ports:
    - name: http-vllm-chat
      port: 80
      protocol: TCP
      targetPort: 8000
  sessionAffinity: None
  type: ClusterIP # internal only; expose through the gateway, not directly

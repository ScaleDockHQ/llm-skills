# OpenTelemetry Collector in front of Datadog Agent Observability (LLM Observability): strips message content, marks traces for conversion.
# Verified against Datadog docs "OpenTelemetry Instrumentation" (Agent Observability), validated with collector-contrib 0.162.0, 2026-10-11.
# Env (set values from a 0600 env file): DD_API_KEY, DD_OTLP_TRACES_ENDPOINT
#   The traces endpoint is site specific; copy it from the Datadog docs page or the in-app onboarding for your DD_SITE.
# Datadog's OTLP traces intake accepts http/protobuf and http/json, not grpc. The dd-otlp-source header routes spans to Agent Observability.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  resource/llmobs:
    attributes:
      - key: dd_llmobs_enabled # enables conversion of the trace's generative-AI spans
        value: true
        action: upsert
  attributes/strip-content:
    actions:
      # Remove these three to keep full prompts and completions in Datadog.
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
  batch: {}

exporters:
  otlphttp/datadog:
    traces_endpoint: ${env:DD_OTLP_TRACES_ENDPOINT}
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otlp-source: llmobs

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource/llmobs, attributes/strip-content, batch]
      exporters: [otlphttp/datadog]

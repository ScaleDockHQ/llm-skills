# Shared model tree for ComfyUI. Pass with: --extra-model-paths-config /path/to/extra_model_paths.yaml
# Format read from utils/extra_config.py and extra_model_paths.yaml.example at ComfyUI v0.39.0 (2026-10-11).
# base_path expands ~ and $VARS; other entries join onto it; several folders per key go on separate lines.
shared:
  base_path: /srv/models/comfy
  is_default: true # list these folders first and use them for downloads
  checkpoints: checkpoints/
  diffusion_models: diffusion_models/
  text_encoders: text_encoders/
  vae: vae/
  loras: loras/
  controlnet: controlnet/
  upscale_models: upscale_models/

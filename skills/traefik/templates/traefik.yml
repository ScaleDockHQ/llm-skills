# Static configuration. Changes need a restart.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0s # large prompts; default is 60s
        writeTimeout: 0s # default; keep 0 for streaming
        idleTimeout: 180s
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
certificatesResolvers:
  le:
    acme:
      email: you@example.com
      storage: /data/acme.json
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      tlsChallenge: {}
api:
  dashboard: true # insecure stays false
ping: {}
log:
  level: INFO
accessLog: {}

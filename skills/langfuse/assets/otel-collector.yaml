# OpenTelemetry Collector (contrib) config: receive OTLP, strip GenAI content, send to Langfuse.
# Langfuse accepts OTLP over HTTP only (no gRPC) at <host>/api/public/otel.
# LANGFUSE_AUTH_STRING = base64("<public key>:<secret key>"), built without echoing the keys:
#   export LANGFUSE_AUTH_STRING=$(printf '%s:%s' "$LANGFUSE_PUBLIC_KEY" "$LANGFUSE_SECRET_KEY" | base64 | tr -d '\n')
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  attributes/strip-genai-content: # delete these when content capture is not approved
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
  batch: {}
exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT} # e.g. http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH_STRING}"
      x-langfuse-ingestion-version: "4"
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip-genai-content, batch]
      exporters: [otlphttp/langfuse]

# Prometheus + Alertmanager + Grafana on one monitoring host. Everything binds to loopback;
# put TLS and auth in front (Caddy, Tailscale Serve) before exposing Grafana.
# Verified against Prometheus v3.15.0, Alertmanager v0.34.1, Grafana v13.2.3, 2026-10-11.
# Secrets: create ./secrets/grafana-admin-password (mode 0600) first; never inline it here.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle # POST /-/reload; keep 9090 private
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./secrets:/etc/prometheus/secrets:ro # scrape keys, readable by uid 65534
      - prometheus-data:/prometheus
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./secrets/grafana-admin-password:/run/secrets/grafana_admin_password:ro
    restart: unless-stopped
volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

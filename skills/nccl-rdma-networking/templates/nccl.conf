# Static NCCL configuration. Point to it with NCCL_CONF_FILE=/etc/nccl.conf
# (absolute path, since NCCL 2.23) or place it at ~/.nccl.conf.
# Set only what detection gets wrong; remove anything not proven by a measurement.

# Bootstrap and socket interface (exact name); example: management or IB IPoIB interface.
# NCCL_SOCKET_IFNAME==eth0

# RDMA devices, exact names with a leading "=".
# NCCL_IB_HCA==mlx5_0:1,mlx5_1:1

# RoCE only; vendor-specific.
# NCCL_IB_TC=
# NCCL_IB_QPS_PER_CONNECTION=2

# Do NOT set NCCL_IB_GID_INDEX on NCCL 2.21 and later.

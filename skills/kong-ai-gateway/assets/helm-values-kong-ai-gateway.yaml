# Values for the kong/kong-ai-gateway chart (Konnect AI Gateway 2.x data plane). Chart 0.2.1 defaults to image tag 2.0.3: pin a current tag.
#   helm repo add kong https://charts.konghq.com && helm repo update
#   kubectl create namespace kong
#   kubectl -n kong create secret tls kong-cluster-cert --cert=tls.crt --key=tls.key   # the client cert Konnect trusts for this control plane
#   helm install my-ai-gateway kong/kong-ai-gateway -n kong -f assets/helm-values-kong-ai-gateway.yaml
# Chart README: https://github.com/Kong/charts/tree/main/charts/kong-ai-gateway (example-values/ has cert-manager and BYO-cert files).
image:
  repository: kong/kong-ai-gateway
  tag: "2.2.0" # confirm at https://hub.docker.com/r/kong/kong-ai-gateway/tags
env:
  # From the control plane's connection details page in Konnect:
  cluster_control_plane: CHANGEME-control-plane-endpoint.konghq.com:443
  cluster_server_name: CHANGEME-control-plane-endpoint.konghq.com
  cluster_telemetry_endpoint: CHANGEME-telemetry-endpoint.konghq.com:443
  cluster_telemetry_server_name: CHANGEME-telemetry-endpoint.konghq.com

# Kong Gateway OSS 3.9.3 in DB-less mode with the ai-proxy plugin (free tier).
# 1. Render the decK file with secrets from the environment (keep the output 0600, never commit it):
#      umask 077
#      export DECK_UPSTREAM_URL=http://host.docker.internal:8000/v1/chat/completions   # vLLM or Ollama on the host
#      deck file render assets/kong-ai-proxy.yaml -o kong.rendered.yaml
# 2. docker compose -f assets/docker-compose.yaml up -d      # Kong is published on 127.0.0.1:8100 (8000 is vLLM's default)
# 3. curl -s http://127.0.0.1:8100/v1/chat/completions -H 'Content-Type: application/json' \
#      -d '{"model":"local","messages":[{"role":"user","content":"hi"}]}'
# The Admin API (host 127.0.0.1:8101) has no auth in OSS; keep it on loopback.
services:
  kong:
    image: kong:3.9.3 # check https://hub.docker.com/_/kong for newer tags
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong.rendered.yaml:/kong/declarative/kong.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8100:8000"
      - "127.0.0.1:8101:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

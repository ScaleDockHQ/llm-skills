# Hand-written InferencePool, only when you run the EPP yourself. The llm-d-router charts create this for you
# (router.inferencePool.create=true). API: inference.networking.k8s.io/v1 (GA).
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: vllm-qwen3-32b
spec:
  selector:
    matchLabels:
      app: vllm-qwen3-32b # must match the model-server pod labels, same namespace
  targetPorts:
    - number: 8000
  endpointPickerRef:
    name: vllm-qwen3-32b-epp
    port:
      number: 9002
    failureMode: FailOpen # API default is FailClose

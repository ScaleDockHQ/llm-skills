# Triton on Kubernetes. Needs the NVIDIA device plugin (GPU Operator) and a PVC named triton-models
# holding the model repository. Keep the Service ClusterIP and put a gateway in front: no built-in auth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
spec:
  replicas: 1
  selector:
    matchLabels: { app: triton }
  template:
    metadata:
      labels: { app: triton }
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:26.09-py3
          args:
            [
              "tritonserver",
              "--model-repository=/models",
              "--disable-auto-complete-config",
            ]
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 8001 }
            - { name: metrics, containerPort: 8002 }
          readinessProbe:
            httpGet: { path: /v2/health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v2/health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /v2/health/ready, port: http }
            failureThreshold: 60
            periodSeconds: 10
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: triton-models }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
spec:
  selector: { app: triton }
  ports:
    - { name: http, port: 8000, targetPort: http }
    - { name: grpc, port: 8001, targetPort: grpc }
    - { name: metrics, port: 8002, targetPort: metrics }

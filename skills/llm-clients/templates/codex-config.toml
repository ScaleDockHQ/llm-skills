# Codex CLI -> LLM gateway. Merge into ~/.codex/config.toml (user file; project
# .codex/config.toml cannot redirect credentials).
# Codex only speaks the Responses API: the gateway must serve /v1/responses
# (LiteLLM bridges chat-only backends with use_chat_completions_api).
# Docs: https://learn.chatgpt.com/docs/config-file/config-reference

model = "coder"
model_provider = "gateway"

# Declare limits for models Codex does not know.
model_context_window = 131072
model_auto_compact_token_limit = 110000

# Set to "none" if the backend rejects reasoning summaries.
# model_reasoning_summary = "none"

[model_providers.gateway]
name = "LLM gateway"
base_url = "https://llm.example.com/v1"
# Name of the env var holding the per-tool virtual key; never the key itself.
env_key = "LITELLM_API_KEY"
env_key_instructions = "Export LITELLM_API_KEY with your Codex virtual key from the gateway admin."
wire_api = "responses"
request_max_retries = 4
stream_max_retries = 5
stream_idle_timeout_ms = 300000

# Optional: fetch a short-lived token from a helper instead of env_key.
# Do not combine with env_key.
# [model_providers.gateway.auth]
# command = "/usr/local/bin/fetch-gateway-token"
# args = ["--audience", "codex"]
# timeout_ms = 5000
# refresh_interval_ms = 300000

# Optional: a second profile, used with `codex --profile local`, lives in
# ~/.codex/local.config.toml and can point model_provider elsewhere.

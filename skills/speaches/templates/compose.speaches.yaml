# Speaches, loopback-only, key-protected, CUDA. Standalone (does not extend upstream's compose.yaml).
# Verified against Speaches master compose.yaml, compose.cuda.yaml and docs/installation.md, 2026-10-11.
# Create the key file first, readable only by you, and never print it:
#   umask 077; printf 'API_KEY=%s\n' "$(openssl rand -hex 24)" > speaches.env
# Pin the image (a version tag or digest) for shared hosts; latest-* follows master.
# CPU only: replace the image with ghcr.io/speaches-ai/speaches:latest-cpu and delete the deploy block.
services:
  speaches:
    container_name: speaches
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./speaches.env
    environment:
      ENABLE_UI: "false"
      LOG_LEVEL: info
      STT_MODEL_TTL: "600"
      TTS_MODEL_TTL: "600"
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  hf-hub-cache:

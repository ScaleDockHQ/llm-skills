# LiteLLM model_list entries for Speaches STT and TTS.
# Verified against LiteLLM v1.105.0 audio docs and Speaches master, 2026-10-11.
# Option A: LiteLLM -> Speaches directly. The text after openai/ is the Speaches model id.
model_list:
  - model_name: whisper
    litellm_params:
      model: openai/Systran/faster-whisper-small
      api_base: http://127.0.0.1:8000/v1
      api_key: os.environ/SPEACHES_API_KEY
      timeout: 600
    model_info:
      mode: audio_transcription
  - model_name: tts
    litellm_params:
      model: openai/speaches-ai/Kokoro-82M-v1.0-ONNX
      api_base: http://127.0.0.1:8000/v1
      api_key: os.environ/SPEACHES_API_KEY
    model_info:
      mode: audio_speech
      health_check_voice: af_heart
# Option B: LiteLLM -> llama-swap -> Speaches. Use api_base http://127.0.0.1:8080/v1,
# api_key os.environ/LLAMA_SWAP_API_KEY and model openai/<llama-swap id> (see references/combos).

# Drop-in for the Ollama systemd service.
# Install: sudo mkdir -p /etc/systemd/system/ollama.service.d
#          sudo cp override.conf /etc/systemd/system/ollama.service.d/override.conf
#          sudo systemctl daemon-reload && sudo systemctl restart ollama
# Or run: sudo systemctl edit ollama   and paste the [Service] block.
# Reference: https://docs.ollama.com/linux (Customizing) and https://docs.ollama.com/faq
[Service]
# Loopback only. Use 0.0.0.0:11434 (or a Tailscale IP) only with a firewall or proxy in front.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Set the context explicitly (4k default below 24 GiB VRAM). Agents want 64000 or more.
Environment="OLLAMA_CONTEXT_LENGTH=32768"
Environment="OLLAMA_KEEP_ALIVE=10m"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=2"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
# Optional: models on a bigger disk (must be writable by the ollama user).
# Environment="OLLAMA_MODELS=/srv/ollama/models"
# Optional: restrict GPUs by UUID (nvidia-smi -L).
# Environment="CUDA_VISIBLE_DEVICES=GPU-xxxxxxxx"
# Optional: local-only mode (disables cloud models and web search).
# Environment="OLLAMA_NO_CLOUD=1"
# Optional: proxy for model pulls (HTTPS only; do not set HTTP_PROXY).
# Environment="HTTPS_PROXY=https://proxy.example.com"

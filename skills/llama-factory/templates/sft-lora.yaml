# LLaMA-Factory LoRA SFT. Run from the repo root:  llamafactory-cli train sft-lora.yaml
# Keys mirror examples/train_lora/qwen3_lora_sft.yaml at v0.9.5. Register your dataset in
# data/dataset_info.json first (see templates/dataset_info.custom.json).

### model
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
trust_remote_code: true
# QLoRA: uncomment (needs bitsandbytes)
# quantization_bit: 4
# quantization_method: bnb

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: my_sft # key in dataset_info.json
template: qwen3_nothink # must match the model family; reuse at chat/export time
cutoff_len: 2048
preprocessing_num_workers: 16
dataloader_num_workers: 4
val_size: 0.1 # hold out data

### output
output_dir: saves/my-sft/lora
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none # none, wandb, tensorboard, swanlab, mlflow (WANDB_API_KEY from the environment)

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
# multi-GPU ZeRO-3: add  deepspeed: examples/deepspeed/ds_z3_config.json  and launch with FORCE_TORCHRUN=1

# Embedding model the Chroma client-side OpenAI embedding function calls via LiteLLM (LiteLLM does not proxy Chroma).
model_list:
  - model_name: embed-default
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-0.6B
      api_base: http://tei-embed:80/v1
      api_key: os.environ/TEI_API_KEY
    model_info:
      mode: embedding

# OpenTelemetry Collector (contrib 0.162.0) in front of Phoenix.
# Apps send OTLP to this Collector; content attributes are stripped; spans go to one Phoenix project.
# Validate: otelcol-contrib validate --config=otel-collector.yaml
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  transform/strip-content:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # OpenTelemetry GenAI content (Opt-In attributes in the spec)
          - delete_key(span.attributes, "gen_ai.input.messages")
          - delete_key(span.attributes, "gen_ai.output.messages")
          - delete_key(span.attributes, "gen_ai.system_instructions")
          - delete_key(span.attributes, "gen_ai.tool.definitions")
          # OpenInference content (llm.input_messages.0.message.content, ...)
          - delete_matching_keys(span.attributes, "^llm\\.(input|output)_messages\\..*")
          - delete_key(span.attributes, "input.value")
          - delete_key(span.attributes, "output.value")
      - context: spanevent
        statements:
          # Older GenAI instrumentations put content on span events
          - delete_matching_keys(spanevent.attributes, "^gen_ai\\.(prompt|completion|input\\.messages|output\\.messages|system_instructions)")
  batch: {}

exporters:
  otlphttp/phoenix:
    endpoint: ${env:PHOENIX_ENDPOINT} # base URL, for example http://phoenix:6006 (the exporter appends /v1/traces)
    headers:
      x-project-name: ${env:PHOENIX_PROJECT} # needs Phoenix 15.5.0 or newer
      # Only when Phoenix auth is on; the key is read from the environment, never written here
      authorization: Bearer ${env:PHOENIX_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/strip-content, batch]
      exporters: [otlphttp/phoenix]

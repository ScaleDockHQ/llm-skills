name: Setup
description: Install pnpm, the Node version from .node-version, and the locked dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        node-version-file: .node-version
        cache: true
        require-lockfile: true

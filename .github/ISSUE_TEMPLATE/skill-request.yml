name: Skill request
description: Propose a new skill or a change to an existing one.
labels: [enhancement]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      description: An existing skill name, or the proposed kebab-case name.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What the agent should be able to do, and when it should load the skill.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to upstream docs, hardware, runtimes or examples.

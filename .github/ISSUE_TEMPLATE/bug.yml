name: Bug report
description: A skill gives wrong, outdated or broken guidance.
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill and version
      placeholder: local-llms 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the agent did, and which file or step of the skill caused it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Hardware, OS and runtime
      placeholder: DGX Spark, Ubuntu 24.04, vLLM 0.x
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: Cursor, Claude Code, Codex
